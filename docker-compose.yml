services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: readycheck
      POSTGRES_PASSWORD: readycheck
      POSTGRES_DB: readycheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://readycheck:readycheck@postgres:5432/readycheck
      REDIS_URL: redis://redis:6379
      READYCHECK_API_KEY: ${READYCHECK_API_KEY:-}
      PORT: 3001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      API_URL: ${API_URL:-http://localhost:3001}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_PRO_PLAN_ID: ${PAYPAL_PRO_PLAN_ID:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://readycheck:readycheck@postgres:5432/readycheck
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      READYCHECK_API_URL: http://api:3001
      READYCHECK_API_KEY: ${READYCHECK_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
      NEXT_PUBLIC_DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      NEXT_PUBLIC_PAYPAL_PRO_PLAN_ID: ${PAYPAL_PRO_PLAN_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
