apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: readycheck-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: readycheck-ai/api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: readycheck-config
            - secretRef:
                name: readycheck-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          # Graceful shutdown (apps/api/src/main.ts) needs time to close the
          # HTTP server, BullMQ queue, and Prisma connection before SIGKILL.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: readycheck-ai
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
