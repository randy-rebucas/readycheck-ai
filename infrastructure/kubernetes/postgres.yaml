# Self-hosted Postgres for dev/staging clusters. Production deployments should
# use a managed database (RDS/Cloud SQL/etc.) and point DATABASE_URL at it
# instead of applying this file.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: readycheck-ai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: readycheck
            - name: POSTGRES_DB
              value: readycheck
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: readycheck-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "readycheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: readycheck-ai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
